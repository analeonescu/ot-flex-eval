[project]
name = "sdl-eval"
version = "0.1.0"
description = "Evaluate an LLM agent orchestrating a two-round Gibson assembly on an Opentrons Flex"
requires-python = ">=3.10"
# opentrons is a hard dependency: protocols are really simulated, not statically checked.
dependencies = ["inspect-ai>=0.3.200", "pyyaml", "opentrons"]

[project.optional-dependencies]
flex = ["requests"]   # HTTP client for driving a real Flex
dev = ["pytest"]
# `pip install -e ".[analysis]"`, then open analysis/eval_scores.ipynb in VS Code, or
# run `python analysis/eval_app.py` for the step-by-step replay of each sample.
#
# Pinned around opentrons, which needs numpy<2 and jsonschema<4.18:
#   numpy / pandas / matplotlib / contourpy  newer releases want numpy>=2, which
#       breaks opentrons.simulate ("cannot import name 'trapz' from 'numpy'")
#   ipykernel, not `notebook`  the Jupyter server pulls in jupyter_events, which needs
#       jsonschema>=4.18. That can never sit beside opentrons, so pip backtracks
#       through every opentrons release down to 4.0 and fails building urwid.
#       ipykernel is all VS Code and nbclient need; for browser Jupyter, run it from
#       a separate environment and pick this venv's kernel.
#   dash<4  keeps the app on the 3.x API it was written against.
analysis = ["numpy>=1.26,<2", "pandas>=2.0,<2.3", "matplotlib>=3.7,<3.10",
            "contourpy<1.4", "ipykernel", "nbformat", "nbclient", "dash>=3.0,<4"]

[project.scripts]
sdl-eval = "sdl_eval.__main__:main"   # sdl-eval --help  lists the task's -T options

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import the package from src/ without relying on an editable install. macOS can set
# the "hidden" flag on the .pth file an editable install writes, and since Python 3.11
# `site` silently skips hidden .pth files, so the install looks fine but imports fail.
pythonpath = ["src", "tests"]   # tests/ holds oracle.py and reference_protocol.py (test fixtures)
# The end-to-end tests drive real Opentrons simulations, so they take ~40s. The unit
# tests run in ~3s:  pytest -m "not slow"
markers = ["slow: drives the full Inspect pipeline and the Opentrons simulator"]
